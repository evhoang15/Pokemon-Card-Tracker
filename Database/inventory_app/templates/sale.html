{% extends "base.html" %}
{% block title %}Log Sale{% endblock %}
{% block content %}
<h1>Log a Sale</h1>

<form id="sale-form">
    <label>Search Lot</label>
    <input type="text" id="lot_search" placeholder="Type a product name...">
    <div class="search-results" id="lot-search-results"></div>
    <div id="selected-lot" style="font-weight: 600;"></div>
    <input type="hidden" id="lot_id">

    <label>Quantity Sold</label>
    <input type="number" id="quantity_sold" value="1" min="1" required>

    <label>Sale Price ($) <span style="font-weight: normal;">(total, or per-unit if quantity > 1)</span></label>
    <input type="number" step="0.01" id="sale_price" required>

    <label>Sale Date</label>
    <input type="date" id="sale_date" required>

    <label>Notes (optional)</label>
    <input type="text" id="notes" placeholder="e.g. sold at Show X">

    <button type="submit">Log Sale</button>
</form>

<div id="status"></div>

<script>
let lots = [];
let selectedLotId = null;

function loadLots() {
    fetch("/api/lots")
        .then(r => r.json())
        .then(data => {
            lots = data;
        });
}
loadLots();

const lotSearchInput = document.getElementById("lot_search");
const lotResultsDiv = document.getElementById("lot-search-results");
const selectedLotDiv = document.getElementById("selected-lot");

function formatLotLabel(lot) {
    const numberPart = lot.card_number ? ` #${lot.card_number}` : "";
    const rarityPart = lot.rarity_name ? ` — ${lot.rarity_name}` : "";
    return `${lot.product_name}${numberPart}${rarityPart}`;
}

lotSearchInput.addEventListener("input", () => {
    const query = lotSearchInput.value.trim().toLowerCase();
    lotResultsDiv.innerHTML = "";

    if (query.length < 2) {
        return;
    }

    const matches = lots.filter(lot => lot.product_name && lot.product_name.toLowerCase().includes(query));

    matches.slice(0, 20).forEach(lot => {
        const div = document.createElement("div");
        div.className = "search-result-item";
        div.textContent = `#${lot.lot_id}: ${formatLotLabel(lot)} (${lot.quantity_remaining} remaining)`;
        div.onclick = () => {
            selectedLotId = lot.lot_id;
            document.getElementById("lot_id").value = lot.lot_id;
            selectedLotDiv.textContent = `Selected: ${formatLotLabel(lot)} | Condition: ${lot.condition_name || "N/A"} | Bought: $${lot.purchase_price} on ${lot.purchase_date} | Remaining: ${lot.quantity_remaining}`;
            lotResultsDiv.innerHTML = "";
            lotSearchInput.value = "";
        };
        lotResultsDiv.appendChild(div);
    });
});

document.getElementById("sale-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const statusDiv = document.getElementById("status");

    if (!selectedLotId) {
        statusDiv.innerHTML = `<div class="status-msg status-error">Please select a lot first.</div>`;
        return;
    }

    const payload = {
        lot_id: selectedLotId,
        quantity_sold: document.getElementById("quantity_sold").value,
        sale_price: document.getElementById("sale_price").value,
        sale_date: document.getElementById("sale_date").value,
        notes: document.getElementById("notes").value || null
    };

    fetch("/api/sale", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            statusDiv.innerHTML = `<div class="status-msg status-error">${data.error}</div>`;
        } else {
            statusDiv.innerHTML = `<div class="status-msg status-success">Sale logged.</div>`;
            document.getElementById("sale-form").reset();
            selectedLotId = null;
            selectedLotDiv.textContent = "";
            loadLots(); // refresh remaining quantities
        }
    });
});
</script>
{% endblock %}
