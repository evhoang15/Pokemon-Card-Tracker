<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - Leftover Cards</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 400px; margin: 80px auto; background: #f7f7f8; }
        h1 { font-size: 1.4em; }
        form { display: flex; flex-direction: column; gap: 12px; }
        label { font-weight: 600; font-size: 0.9em; }
        input { padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; font-size: 1em; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <h1>Log In</h1>
    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Log In</button>
    </form>
</body>
</html>
