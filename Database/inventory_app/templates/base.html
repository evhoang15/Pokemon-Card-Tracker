<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Leftover Cards - Inventory{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f7f7f8; }
        nav { display: flex; gap: 16px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
        nav a { text-decoration: none; color: #333; font-weight: 600; }
        nav a:hover { color: #0066cc; }
        h1 { font-size: 1.4em; }
        form { display: flex; flex-direction: column; gap: 12px; max-width: 400px; }
        label { font-weight: 600; font-size: 0.9em; }
        input, select { padding: 8px; font-size: 1em; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px; font-size: 1em; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0052a3; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 0.9em; }
        th { background: #eee; }
        .search-results { border: 1px solid #ccc; border-radius: 4px; max-height: 200px; overflow-y: auto; }
        .search-result-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-result-item:hover { background: #eef; }
        .status-msg { padding: 10px; border-radius: 4px; margin-top: 12px; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Inventory</a>
        <a href="/purchase">Log Purchase</a>
        <a href="/sale">Log Sale</a>
        <a href="/logout" style="margin-left: auto;">Log Out</a>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
